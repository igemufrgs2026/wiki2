  <div id="ring-tooltip"></div>
</div>

<script>
(function () {
  const DEFAULT_TEXT = "No description available.";

  const wrapper = document.getElementById('map-wrapper');
  const container = wrapper.querySelector('.container');
  const tooltip = document.getElementById('ring-tooltip');
  const rings = wrapper.querySelectorAll('.individual-ring');

  rings.forEach(function (ring) {
    if (!ring.hasAttribute('data-tooltip')) {
      ring.setAttribute('data-tooltip', DEFAULT_TEXT);
    }
  });

  function positionTooltip(evt) {
    const wrapperRect = wrapper.getBoundingClientRect();
    const offsetX = 16;
    const offsetY = 8;
    let left = evt.clientX - wrapperRect.left + offsetX;
    let top = evt.clientY - wrapperRect.top + offsetY;

    const tooltipWidth = tooltip.offsetWidth || 240;
    const tooltipHeight = tooltip.offsetHeight || 40;
    if (left + tooltipWidth > wrapperRect.width) {
      left = evt.clientX - wrapperRect.left - tooltipWidth - offsetX;
    }
    if (top + tooltipHeight > wrapperRect.height) {
      top = wrapperRect.height - tooltipHeight - 4;
    }

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  rings.forEach(function (ring) {
    ring.addEventListener('mouseenter', function (evt) {
      container.classList.add('hovering');
      ring.classList.add('active');
      tooltip.textContent = ring.getAttribute('data-tooltip') || DEFAULT_TEXT;
      tooltip.style.display = 'block';
      positionTooltip(evt);
    });

    ring.addEventListener('mousemove', function (evt) {
      positionTooltip(evt);
    });

    ring.addEventListener('mouseleave', function () {
      container.classList.remove('hovering');
      ring.classList.remove('active');
      tooltip.style.display = 'none';
    });
  });
})();
</script>
